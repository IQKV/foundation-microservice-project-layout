# ===================================================================
# Spring Boot configuration for the "local" profile.
# Overrides base: enables Liquibase with demo data, relaxes actuator,
# enables debug logging.
# ===================================================================

spring:
  liquibase:
    enabled: true
    contexts: demo

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.iqkv: DEBUG
    org.mybatis: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

iqkv:
  messaging:
    rabbitmq:
      enabled: true
